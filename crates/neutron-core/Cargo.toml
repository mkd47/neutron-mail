[package]
name = "neutron-core"
version = "0.5.1"
description = "Neutron Mail core: IMAP sync, SMTP send, cache, search, sanitizing"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
tokio = { version = "1", features = ["net", "time", "sync", "macros", "rt"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
webpki-roots = "1"
futures = "0.3"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "rustls-native-certs", "ring", "hostname"] }
mail-parser = { version = "0.11", features = ["full_encoding"] }
encoding_rs = "0.8"
ammonia = "4"
rusqlite = { version = "0.37", features = ["bundled-sqlcipher"] }
getrandom = "0.3"
sha2 = "0.10"
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
zeroize = "1"
base64 = "0.22"
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
mail-builder = "1.0.0"
url = "2.5.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
chrono-tz = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"

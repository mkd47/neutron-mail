# cargo-deny policy. Run: cargo deny check
[graph]
all-features = false

[advisories]
# Fail on vulnerabilities; unmaintained/unsound are reviewed in docs/AUDIT.md.
ignore = [
  # proc-macro-error: build-time proc macro pulled in by GTK3 bindings (via Tauri/wry). No runtime exposure.
  { id = "RUSTSEC-2024-0370", reason = "transitive via gtk3-rs (Tauri Linux backend); build-time only" },
  # zbus 5 helper crates, merged into zbus 6 (2026-10). keyring 4 removed the
  # duplicate zbus 4 copy; these remain through our D-Bus code and Tauri's
  # plugins. Not vulnerabilities. Revisit when Tauri moves to zbus 6.
  { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; no safe upgrade yet (Tauri plugins use zbus 5)" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; no safe upgrade yet (Tauri plugins use zbus 5)" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; no safe upgrade yet (Tauri plugins use zbus 5)" },
]

[licenses]
# Permissive + weak-copyleft licenses compatible with any future project license choice.
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "MPL-2.0", "BSL-1.0",
  "CDLA-Permissive-2.0", "0BSD", "OpenSSL",
]
confidence-threshold = 0.9
# Our own crates are GPL-3.0-or-later and unpublished.
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[workspace]
resolver = "2"
members = ["crates/neutron-core", "src-tauri"]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-or-later"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Release builds are what `cargo tauri build` packages into the .deb/.rpm.
# One codegen unit + fat LTO lets LLVM inline and drop dead code across the
# whole dependency graph (Tauri, wry, html5ever, rustls, ...): smaller and
# usually faster binary, at the cost of a slower release link. `strip` removes
# the symbol table, which neither package ships or uses. `panic` stays
# "unwind" on purpose: a panic in one Tauri command or tokio task must not
# abort the whole mail client.
[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"

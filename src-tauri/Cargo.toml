[package]
name = "neutron-mail"
version = "0.1.0"
description = "Neutron Mail – a native IMAP/SMTP client (prototype)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "neutron_mail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
neutron-core = { path = "../crates/neutron-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["fs", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde_json = "1.0.154"

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "=2.0.2"
